name: Compilar Sistema Congreso (Mac Intel y Windows)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  compilar-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python x86_64 (Mac Intel)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Compilar apps y crear DMG compatible con Mac Intel
        run: |
          APP_PATH=$(find . -maxdepth 4 -iname "Congreso_App.py" | head -n 1)
          CFG_PATH=$(find . -maxdepth 4 -iname "Configurador_Congreso.py" | head -n 1)

          if [ -z "$APP_PATH" ] || [ -z "$CFG_PATH" ]; then
            echo "ERROR: No se encontraron Congreso_App.py o Configurador_Congreso.py"
            exit 1
          fi

          python -m pip install --upgrade pip
          pip install pyinstaller flask pandas openpyxl

          pyinstaller --noconfirm --windowed --onedir --target-architecture x86_64 --name "Congreso_App" "$APP_PATH"
          pyinstaller --noconfirm --windowed --onedir --target-architecture x86_64 --name "Configurador_Congreso" "$CFG_PATH"

          xattr -cr "dist/Congreso_App.app" || true
          xattr -cr "dist/Configurador_Congreso.app" || true

          codesign --force --deep --sign - "dist/Congreso_App.app"
          codesign --force --deep --sign - "dist/Configurador_Congreso.app"

          rm -rf carpeta_dmg
          mkdir -p carpeta_dmg
          cp -R "dist/Congreso_App.app" carpeta_dmg/
          cp -R "dist/Configurador_Congreso.app" carpeta_dmg/
          ln -s /Applications carpeta_dmg/Applications

          hdiutil create -volname "Sistema_Congreso_Intel" -srcfolder carpeta_dmg -ov -format UDRO "Sistema_Congreso_Intel.dmg"

      - name: Publicar DMG de macOS Intel
        uses: actions/upload-artifact@v4
        with:
          name: Sistema_Congreso_Intel_DMG
          path: Sistema_Congreso_Intel.dmg

  compilar-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compilar apps en carpeta para Windows
        shell: bash
        run: |
          APP_PATH=$(find . -maxdepth 4 -iname "Congreso_App.py" | head -n 1)
          CFG_PATH=$(find . -maxdepth 4 -iname "Configurador_Congreso.py" | head -n 1)

          if [ -z "$APP_PATH" ] || [ -z "$CFG_PATH" ]; then
            echo "ERROR: No se encontraron Congreso_App.py o Configurador_Congreso.py"
            exit 1
          fi

          python -m pip install --upgrade pip
          pip install pyinstaller flask pandas openpyxl

          pyinstaller --noconfirm --windowed --onedir --name "Congreso_App" "$APP_PATH"
          pyinstaller --noconfirm --windowed --onedir --name "Configurador_Congreso" "$CFG_PATH"

          mkdir -p paquete_windows
          cp -R "dist/Congreso_App" paquete_windows/
          cp -R "dist/Configurador_Congreso" paquete_windows/

          powershell -Command "Compress-Archive -Path 'paquete_windows\*' -DestinationPath 'Sistema_Congreso_Windows.zip' -Force"

      - name: Publicar paquete Windows
        uses: actions/upload-artifact@v4
        with:
          name: Sistema_Congreso_Windows
          path: Sistema_Congreso_Windows.zip
