name: Compilar Congreso_App y Configurador

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  compilar-macos-intel:
    runs-on: macos-15-intel
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python x86_64 (Intel)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Instalar dependencias y empaquetar DMG para Mac Intel
        run: |
          APP_PATH=$(find . -maxdepth 4 -iname "Congreso_App.py" | head -n 1)
          CFG_PATH=$(find . -maxdepth 4 -iname "Configurador_Congreso.py" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró Congreso_App.py"
            exit 1
          fi
          if [ -z "$CFG_PATH" ]; then
            echo "ERROR: No se encontró Configurador_Congreso.py"
            exit 1
          fi

          python -m pip install --upgrade pip
          pip install pyinstaller flask pandas openpyxl

          pyinstaller --noconfirm --windowed --onedir --target-architecture x86_64 --name "Congreso_App" "$APP_PATH"
          pyinstaller --noconfirm --windowed --onedir --target-architecture x86_64 --name "Configurador_Congreso" "$CFG_PATH"

          codesign --force --deep --sign - "dist/Congreso_App.app"
          codesign --force --deep --sign - "dist/Configurador_Congreso.app"

          mkdir -p staging
          cp -R "dist/Congreso_App.app" staging/
          cp -R "dist/Configurador_Congreso.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Sistema_Congreso_Mac_Intel" -srcfolder staging -ov -format UDZO "Sistema_Congreso_Mac_Intel.dmg"

      - name: Publicar DMG de macOS Intel
        uses: actions/upload-artifact@v4
        with:
          name: Sistema_Congreso_macOS_Intel
          path: Sistema_Congreso_Mac_Intel.dmg

  compilar-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y empaquetar EXE
        shell: bash
        run: |
          APP_PATH=$(find . -maxdepth 4 -iname "Congreso_App.py" | head -n 1)
          CFG_PATH=$(find . -maxdepth 4 -iname "Configurador_Congreso.py" | head -n 1)

          python -m pip install --upgrade pip
          pip install pyinstaller flask pandas openpyxl

          pyinstaller --noconfirm --onefile --name "Congreso_App" "$APP_PATH"
          pyinstaller --noconfirm --onefile --name "Configurador_Congreso" "$CFG_PATH"

      - name: Publicar EXE de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Sistema_Congreso_Windows
          path: |
            dist/Congreso_App.exe
            dist/Configurador_Congreso.exe
