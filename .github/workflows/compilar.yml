name: Compilar Congreso_App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  compilar-macos:
    runs-on: macos-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y empaquetar DMG
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask pandas openpyxl
          pyinstaller --noconfirm --windowed --onefile --name "Congreso_App" Congreso_App.py
          mkdir -p staging
          cp -R "dist/Congreso_App.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Congreso_App" -srcfolder staging -ov -format UDZO "Congreso_App_Mac.dmg"

      - name: Publicar DMG de macOS
        uses: actions/upload-artifact@v4
        with:
          name: Congreso_App_macOS
          path: Congreso_App_Mac.dmg

  compilar-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y empaquetar EXE
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask pandas openpyxl
          pyinstaller --noconfirm --onefile --name "Congreso_App" Congreso_App.py

      - name: Publicar EXE de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Congreso_App_Windows
          path: dist/Congreso_App.exe
