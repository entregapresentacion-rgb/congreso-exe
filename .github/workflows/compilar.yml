name: Compilar Congreso_App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl

      - name: Compilar ejecutable en macOS
        run: |
          pyinstaller --onefile --windowed --name Congreso_App Congreso_App.py

      - name: Subir artefacto macOS
        uses: actions/upload-artifact@v4
        with:
          name: Congreso_App-macOS
          path: dist/Congreso_App*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl

      - name: Compilar ejecutable en Windows
        run: |
          pyinstaller --onefile --windowed --name Congreso_App Congreso_App.py

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: Congreso_App-Windows
          path: dist/Congreso_App.exe
